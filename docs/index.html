const melodia = escala("C4", "major_pentatonic")

  // baixo no início do compasso, durando 4 batidas

    tambor("chimbal", { amp: 0.4 })

    if (beat === 0 || beat === 2) {
      play(escolher(melodia), { synth: "pluck", dur: 0.5, amp: 0.5 })
    }
    await sleep(1)
  }
})
