<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none" role="img" aria-label="MusicCode Studio">
  <!-- Marcador (equalizador em badge violeta) -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,0)">
    <rect x="1" y="1" width="62" height="62" rx="17" fill="#8b5cf6"/>
    <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#sheen)"/>
    <g fill="#ffffff">
      <rect x="12" y="30" width="6" height="22" rx="3"/>
      <rect x="21" y="19" width="6" height="33" rx="3"/>
      <rect x="30" y="25" width="6" height="27" rx="3"/>
      <rect x="39" y="15" width="6" height="37" rx="3"/>
      <rect x="48" y="23" width="6" height="29" rx="3"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="80" y="40" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.02em" fill="#ffffff">MusicCode</text>
  <text x="233" y="40" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.02em" fill="#8a8a96"> Studio</text>
</svg>
